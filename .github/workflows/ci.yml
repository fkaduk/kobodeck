name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: npm install -g markdownlint-cli
      - run: make check

  vm-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install system-emulation tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm cpio dosfstools
      - uses: actions/cache@v4
        with:
          path: .cache/kobodeck-testvm
          key: kobodeck-testvm-${{ runner.os }}-${{ hashFiles('vm_test.go', 'init_vm.sh') }}
          restore-keys: |
            kobodeck-testvm-${{ runner.os }}-
      - name: Run ARM VM end-to-end release test
        run: make test

  build:
    needs: [check, vm-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for git describe
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make tarball
      - uses: actions/upload-artifact@v4
        with:
          name: KoboRoot
          path: build/KoboRoot.tgz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KoboRoot
      - run: gh release create ${{ github.ref_name }} KoboRoot.tgz --repo ${{ github.repository }} --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
